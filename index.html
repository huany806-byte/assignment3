ocument.createElement('button');b.className='item';b.title=x.name;b.setAttribute('aria-label','Select '+x.name);b.innerHTML='<img alt="" src="'+x.image+'"><span class="item-label"><strong>'+x.name+'</strong><small>'+x.comfort+'</small></span>';b.onclick=()=>{if(!chosen.includes(x.id))chosen.push(x.id);render()};$('slots').appendChild(b)});$('prev').disabled=page===0;$('next').disabled=(page+1)*15>=ITEMS.length;$('count').textContent=(page+1)+' / '+Math.ceil(ITEMS.length/15)+' shelves';$('situation').value=String(current);$('selected').innerHTML='';chosen.forEach(id=>{const x=ITEMS.find(a=>a.id===id),d=document.createElement('div');d.className='picked';d.innerHTML='<img alt="" src="'+x.image+'"><span>'+x.name+'<small style="display:block;color:#829263;margin-top:3px">'+x.comfort+'</small></span><button aria-label="Remove '+x.name+'">×</button>';d.querySelector('button').onclick=()=>{chosen=chosen.filter(v=>v!==id);render()};$('selected').appendChild(d)});if(!chosen.length)$('selected').innerHTML='<p class="hint">No items selected.</p>';const n=Object.keys(archive).length;$('percent').textContent=n*10+'%';$('completed').textContent=n+' of 10 situations completed';$('meter').innerHTML=Array.from({length:10},(_,i)=>'<div class="segment '+(i<n?'filled':'')+'"></div>').join('');$('archive').innerHTML='';SITUATIONS.forEach((s,i)=>{if(!archive[i])return;const r=document.createElement('div');r.className='record';r.innerHTML='<span>'+(i+1)+'. '+s+' ('+archive[i].length+' items)</span><button>Edit</button>';r.querySelector('button').onclick=()=>{current=i;chosen=[...archive[i]];render();$('notice').textContent='Editing saved selection.'};$('archive').appendChild(r)});if(!n)$('archive').innerHTML='<p class="hint">No completed situations yet.</p>';if(n===10)$('notice').textContent='All 10 situations completed!'}$('situation').innerHTML=SITUATIONS.map((s,i)=>'<option value="'+i+'">'+(i+1)+'. '+s+'</option>').join('');$('situation').onchange=e=>{current=+e.target.value;chosen=[...(archive[current]||[])];$('notice').textContent='';render()};$('random').onclick=()=>{let pool=SITUATIONS.map((_,i)=>i).filter(i=>!archive[i]);if(!pool.length)pool=SITUATIONS.map((_,i)=>i);current=pool[Math.floor(Math.random()*pool.length)];chosen=[...(archive[current]||[])];$('notice').textContent='';render()};$('prev').onclick=()=>{page--;render()};$('next').onclick=()=>{page++;render()};$('clear').onclick=()=>{chosen=[];render()};$('confirm').onclick=()=>{if(!chosen.length){$('notice').textContent='Choose at least one item first.';return}archive[current]=[...chosen];save();$('notice').textContent='Selection saved for this situation.';render()};$('restart').onclick=()=>{if(confirm('Clear all 10 saved situations?')){archive={};chosen=[];current=0;page=0;save();$('notice').textContent='';render()}};render();</script></body></html>
